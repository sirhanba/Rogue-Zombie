<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Rogue Zombie</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Telegram Web App Script (oficial) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">

    <!-- ==================== MENU PRINCIPAL ==================== -->
    <div id="screen-menu" class="screen active">
      <div class="menu-logo">
        ROGUE<br><span>ZOMBIE</span>
      </div>
      <p class="menu-subtitle">Sobreviva. Suba. Escape.</p>

      <div class="menu-buttons">
        <button class="btn btn-primary" id="btn-new-run">
          <span class="btn-icon">🧟</span>
          Nova Run
        </button>

        <button class="btn btn-secondary" id="btn-skill-tree">
          <span class="btn-icon">🌳</span>
          Árvore de Habilidades
        </button>
      </div>

      <div class="menu-footer">
        v0.1.0 — Fase 1: Mecânicas
      </div>
    </div>

    <!-- ==================== TELA: NOVA RUN (placeholder) ==================== -->
    <div id="screen-run" class="screen">
      <div class="placeholder-screen">
        <h2>🗺️ Mapa da Run</h2>
        <p>Aqui entrará o mapa procedural de 15 níveis.</p>
        <button class="btn btn-secondary back-btn" data-back="menu">
          ← Voltar ao Menu
        </button>
      </div>
    </div>

    <!-- ==================== TELA: ÁRVORE DE HABILIDADES (placeholder) ==================== -->
    <div id="screen-skills" class="screen">
      <div class="placeholder-screen">
        <h2>🌳 Árvore de Habilidades</h2>
        <p>Aqui entrará a árvore de perks permanentes.</p>
        <button class="btn btn-secondary back-btn" data-back="menu">
          ← Voltar ao Menu
        </button>
      </div>
    </div>

  </div>

  <script src="MapGenerator.js"></script>
  <script src="app.js"></script>
</body>
</html>
