<div id="screen-combat" class="screen">
    <div class="top-bar">
        <span>❤️ Seu HP: <strong id="combat-hp">100</strong></span>
        <span>🔫 Munição: <strong id="combat-ammo">8</strong></span>
    </div>

    <div class="combat-container">
        <h3 id="enemy-name" style="text-align: center; margin-bottom: 5px;">Zumbi</h3>
        <div style="font-size: 12px; color: #a4b0be; text-align: center; margin-bottom: 8px;">HP Zumbi: <span id="enemy-hp">3</span></div>
        <div class="zombie-bar"><div id="zombie-fill"></div></div>

        <!-- Área central com a Rosquinha (esquerda) e os Slots de Armas Empilhados (direita) -->
        <div class="combat-middle-area" style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
            <div class="combat-arena" style="position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center;">
                <canvas id="qteCanvas" width="140" height="140"></canvas>
            </div>
            
            <div class="weapons-vertical-list" style="display: flex; flex-direction: column; gap: 8px; width: 150px;">
                <div id="slot-knife" class="weapon-slot-btn" onclick="switchWeapon('knife')" style="background: #1e272e; border: 1px solid #485460; padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px;">
                    <strong>🔪 Faca</strong><br><span style="font-size: 10px; color: #a4b0be;">Infinito</span>
                </div>
                <div id="slot-pistol" class="weapon-slot-btn active" onclick="switchWeapon('pistol')" style="background: #1e272e; border: 1px solid #ff4757; padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px;">
                    <strong>🔫 9mm</strong><br><span style="font-size: 10px; color: #a4b0be;">1 Munição</span>
                </div>
                <div id="slot-shotgun" class="weapon-slot-btn" onclick="switchWeapon('shotgun')" style="background: #1e272e; border: 1px solid #485460; padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px;">
                    <strong>💣 Escopeta</strong><br><span style="font-size: 10px; color: #a4b0be;">2 Munições</span>
                </div>
            </div>
        </div>

        <!-- Botão de Atacar Grande na parte inferior -->
        <button class="btn" onclick="triggerShoot()" style="width: 100%; padding: 16px; font-size: 16px; background: #ff4757; margin-top: auto;">🔥 ATACAR</button>
    </div>
</div>
